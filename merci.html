<!DOCTYPE html>
<html lang="fr" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci - Pixel Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient-text {
            background: linear-gradient(270deg, #60a5fa, #818cf8, #c084fc, #60a5fa);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 6s ease infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased bg-grid selection:bg-blue-500 selection:text-white min-h-screen flex flex-col justify-center items-center px-6">

    <!-- ORBES LUMINEUX -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="relative bg-gradient-to-b from-slate-900/90 to-slate-950 border border-slate-800/80 p-10 md:p-14 rounded-[2.5rem] backdrop-blur-xl max-w-lg w-full text-center shadow-2xl">
        <div class="w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 mx-auto mb-6 shadow-lg shadow-blue-500/10">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        
        <h1 class="text-3xl font-bold mb-4 tracking-tight animate-gradient-text">Message bien reçu !</h1>
        <p class="text-slate-400 text-sm font-light leading-relaxed mb-8">
            Merci pour votre confiance. J'ai bien reçu votre demande et je l'analyse avec attention. Je vous réponds sous <span class="text-slate-200 font-medium">24h maximum</span>.
        </p>

        <a href="index.html" class="inline-flex items-center justify-center gap-2 px-8 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition duration-300 shadow-lg shadow-blue-600/25">
            Retour à l'accueil
        </a>
    </div>

    <footer class="mt-12 text-xs text-slate-500 font-light">
        <p>&copy; 2026 Pixel Designer. Tous droits réservés.</p>
    </footer>

</body>
</html>
