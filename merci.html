<!DOCTYPE html>
<html lang="fr" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci - Pixel Designer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-gradient-text {
            background: linear-gradient(270deg, #60a5fa, #818cf8, #c084fc, #60a5fa);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 12s ease infinite;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(25px, -20px) scale(1.08); }
        }
        @keyframes floatReverse {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-25px, 20px) scale(1.08); }
        }
        .orb-1 { animation: floatSlow 8s ease-in-out infinite; }
        .orb-2 { animation: floatReverse 10s ease-in-out infinite; }

        @keyframes checkDraw {
            0% { stroke-dashoffset: 40; }
            100% { stroke-dashoffset: 0; }
        }
        .animate-check {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            animation: checkDraw 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-card {
            animation: popUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased bg-grid selection:bg-blue-500 selection:text-white min-h-screen flex flex-col justify-center items-center px-6 overflow-hidden relative">

    <!-- ORBES LUMINEUX ANIMÉS -->
    <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-blue-600/15 rounded-full blur-[130px] pointer-events-none orb-1"></div>
    <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-indigo-600/15 rounded-full blur-[130px] pointer-events-none orb-2"></div>

    <div class="relative bg-gradient-to-b from-slate-900/90 to-slate-950 border border-slate-800/80 p-10 md:p-14 rounded-[2.5rem] backdrop-blur-xl max-w-lg w-full text-center shadow-2xl animate-card">
        
        <!-- ICONE AVEC PULSATION DOUCE -->
        <div class="relative w-16 h-16 rounded-2xl bg-blue-500/10 border border-blue-500/25 flex items-center justify-center text-blue-400 mx-auto mb-6 shadow-lg shadow-blue-500/15">
            <div class="absolute inset-0 rounded-2xl bg-blue-400/20 animate-ping opacity-25 pointer-events-none"></div>
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path class="animate-check" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        
        <h1 class="text-3xl font-bold mb-4 tracking-tight animate-gradient-text">Message bien reçu !</h1>
        <p class="text-slate-400 text-sm font-light leading-relaxed mb-8">
            Merci pour votre confiance. J'ai bien reçu votre demande et je l'analyse avec attention. Je vous réponds sous <span class="text-slate-200 font-medium">24h maximum</span>.
        </p>

        <a href="index.html" class="inline-flex items-center justify-center gap-2 px-8 py-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all duration-300 shadow-lg shadow-blue-600/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 active:translate-y-0">
            <span>Retour à l'accueil</span>
            <svg class="w-4 h-4 transition-transform duration-300 group-hover:-translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <footer class="mt-12 text-xs text-slate-500 font-light relative z-10">
        <p>&copy; 2026 Pixel Designer. Tous droits réservés.</p>
    </footer>

</body>
</html>
