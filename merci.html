<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Merci | Pixel Designer</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#09090b">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>document.documentElement.classList.add('js');</script>
    <script src="assets/js/scene.js" defer></script>
    <script src="assets/js/main.js" defer></script>
</head>
<body>
    <canvas id="bg" data-stage="4" aria-hidden="true"></canvas>

    <header class="nav">
        <div class="container nav-inner">
            <a href="./" class="brand" aria-label="Pixel Designer, accueil">
                <img class="brand-logo" src="assets/img/logo-64.png" srcset="assets/img/logo-64.png 1x, assets/img/logo-128.png 2x" width="32" height="32" alt="">
                <span class="brand-name">Pixel Designer</span>
            </a>
        </div>
    </header>

    <main class="simple">
        <div class="container">
            <div class="simple-inner">
                <p class="eyebrow" data-reveal>
                    <span class="pix" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                    Message envoyé</p>
                <h1 class="h2" data-split>Message bien <span class="grad">reçu.</span></h1>
                <p class="lead" data-reveal style="--d:.2s">Merci pour votre confiance. J'analyse votre demande avec attention et je vous réponds sous 24h ouvrées.</p>
                <div data-reveal style="--d:.3s">
                    <a href="./" class="btn btn-primary">Retour à l'accueil <i class="ph ph-arrow-right" aria-hidden="true"></i></a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
